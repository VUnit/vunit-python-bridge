name: 'lint'

# Lints the Python code with ruff, configured in pyproject.toml, and checks the license
# headers of the source files.

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push cancels the run of the same branch or pull request still in progress.
# On main and on tags every commit has a group of its own, so every run finishes.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-24.04
    name: '🧹 ruff · license headers'
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4

    - name: '🧹 ruff check'
      run: pipx run ruff==0.17.0 check --output-format=github

    # Also when ruff fails, so that one run reports both
    - name: '📜 License headers'
      if: ${{ !cancelled() }}
      run: python3 tools/check_license_headers.py
